[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regcap"
version = "0.1.0"
description = "REGCAP reference implementation"
requires-python = ">=3.8,<3.9"
dependencies = [
  "torch==2.4.1",
  "torch-geometric==2.6.1",
  "pytorch-lightning==2.4.0",
  "torchmetrics==1.5.2",
  "numpy==1.24.4",
  "gensim==3.8.3",
  "nltk==3.9.1",
  "tqdm==4.67.1",
  "scipy==1.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]
